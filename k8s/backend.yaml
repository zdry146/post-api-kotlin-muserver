# Backend: Kotlin mu-server (port 8090)
# Strategy: local images built into Jenkins agent's docker daemon (which shares
# host's /var/run/docker.sock) → K8s pulls via imagePullPolicy: Never.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-api-backend
  namespace: post-api
  labels:
    app: post-api-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-api-backend
  template:
    metadata:
      labels:
        app: post-api-backend
    spec:
      containers:
        - name: backend
          image: post-api-backend:__IMAGE_TAG__
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
          env:
            - name: DB_URL
              value: "jdbc:postgresql://__DB_HOST__:5432/__DB_DATABASE__"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgres"
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            limits:
              memory: "768Mi"
              cpu: "500m"
            requests:
              memory: "384Mi"
              cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: post-api-backend-svc
  namespace: post-api
spec:
  selector:
    app: post-api-backend
  ports:
    - name: http
      port: 8090
      targetPort: 8090
  type: ClusterIP
