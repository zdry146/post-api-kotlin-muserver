# Frontend: Express (port 5174) + vanilla TS dist
# NodePort 30080 — Playwright from host (192.168.232.128:30080)
# imagePullPolicy: Never — images come from Jenkins agent's local docker daemon

apiVersion: apps/v1
kind: Deployment
metadata:
  name: post-api-frontend
  namespace: post-api
  labels:
    app: post-api-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: post-api-frontend
  template:
    metadata:
      labels:
        app: post-api-frontend
    spec:
      containers:
        - name: frontend
          image: post-api-frontend:__IMAGE_TAG__
          imagePullPolicy: Never
          ports:
            - containerPort: 5174
          env:
            - name: PORT
              value: "5174"
            - name: BACKEND_URL
              value: "http://post-api-backend-svc:8090"
          readinessProbe:
            httpGet:
              path: /
              port: 5174
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
            requests:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: post-api-frontend-svc
  namespace: post-api
spec:
  selector:
    app: post-api-frontend
  ports:
    - name: http
      port: 5174
      targetPort: 5174
      nodePort: 30080
  type: NodePort
